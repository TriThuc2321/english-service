name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Testcontainers starts Postgres through the runner's Docker daemon
      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # openapi.json is the FE contract; fail if a code change isn't committed with it
      - name: OpenAPI contract up to date
        run: |
          pnpm openapi:export
          git diff --exit-code -- openapi.json
